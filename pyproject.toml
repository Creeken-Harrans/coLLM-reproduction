[project]
name = "collm-repro"
version = "0.1.0"
description = "CoLLM (IEEE TFS 2026) 复现：模糊决策智能体 + 自反思的大小模型协同 RUL 预测（依赖为共享 venv 超集，核心仅需 torch/transformers/numpy/matplotlib）"
requires-python = ">=3.12"
dependencies = [
    "easyocr>=1.7.2",
    "fastapi==0.141.1",
    "httpx>=0.28.1",
    "huggingface-hub",
    "jieba>=0.42.1",
    "matplotlib",
    "numpy",
    "openai",
    "psycopg[binary]>=3.3.4",
    "pyarrow>=25.0.0",
    "pytest",
    "pyyaml",
    "requests",
    "sentence-transformers==5.6.1",
    "sentencepiece>=0.2.2",
    "torch==2.9.1",
    "transformers>=5.14.1",
    "uvicorn==0.52.1",
]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
